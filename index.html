<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grace</title>
    <meta name="description" content="A growing collection of photos, by month and by place." />

    <!-- The home-screen app: the manifest is what a phone reads to offer the
         site as an app of its own rather than a bookmark, and iOS reads the
         apple-touch-icon instead of anything in the manifest. The two
         theme-colours are the site's own background in each theme, so the
         phone's bars match the page instead of framing it in white. -->
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#fbf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The sentences are written out in English and swapped for the language
         config.json names as the page starts; the keys are in language.js. -->
    <header class="site-header">
      <h1 id="site-title">Grace</h1>
      <a
        class="link-upload"
        href="upload.html"
        aria-label="Add photos"
        data-i18n="gallery.add"
        data-i18n-label="gallery.add.label"
      >Add</a>
      <nav class="views" role="tablist" aria-label="View" data-i18n-label="gallery.views">
        <button
          id="tab-timeline"
          role="tab"
          aria-selected="true"
          aria-controls="timeline"
          data-i18n="gallery.timeline"
        >Timeline</button>
        <button
          id="tab-map"
          role="tab"
          aria-selected="false"
          aria-controls="map"
          data-i18n="gallery.map"
        >Map</button>
      </nav>
    </header>

    <main>
      <section id="timeline" role="tabpanel" aria-labelledby="tab-timeline">
        <p class="status" id="status" data-i18n="gallery.loading">Loading photos…</p>
      </section>
      <section id="map-panel" role="tabpanel" aria-labelledby="tab-map" hidden>
        <div id="map"></div>
        <p id="map-note" class="map-note" hidden></p>
      </section>
    </main>

    <div
      id="lightbox"
      class="lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Photo"
      data-i18n-label="gallery.photo"
    >
      <button class="lightbox-close" aria-label="Close" data-i18n-label="gallery.close">&times;</button>
      <!-- Sending one photo to the family is the commonest thing anybody does
           with an open photo, and until now it meant copying the address bar by
           hand. The icon carries no words, so only its label is translated. -->
      <button id="share" class="lightbox-share" aria-label="Share" data-i18n-label="gallery.share" hidden>
        <svg
          viewBox="0 0 24 24"
          width="21"
          height="21"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3v11" />
          <path d="M8 7l4-4 4 4" />
          <path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
        </svg>
      </button>
      <button class="lightbox-nav prev" aria-label="Previous photo" data-i18n-label="gallery.previous">&#8249;</button>
      <figure>
        <img id="lightbox-image" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav next" aria-label="Next photo" data-i18n-label="gallery.next">&#8250;</button>
      <!-- What the phone's own share sheet cannot say for itself: that a link
           went to the clipboard, or that nothing did. -->
      <p id="toast" class="toast" role="status" hidden></p>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin="" defer></script>
    <!-- A module so it can import photo-url.js; module scripts defer by default. -->
    <script src="app.js" type="module"></script>
  </body>
</html>
