[project]
name = "grace-pipeline"
version = "0.1.0"
description = "Build pipeline for the Grace photo gallery: EXIF -> manifest, HEIC -> web JPEG."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.3",
    "pillow-heif>=0.16",
]

[project.scripts]
grace-pipeline = "grace_pipeline.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grace_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # so a bare `pytest` works in a fresh clone
