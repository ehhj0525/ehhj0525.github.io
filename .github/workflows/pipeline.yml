name: Build gallery

on:
  push:
    branches: [main]
    paths:
      - "photos/**"
      - "web/**"
      - "overrides.json"
      - "src/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

# Uploads often arrive in bursts; let each run finish before the next starts so
# they do not race each other pushing to main.
concurrency:
  group: gallery-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the branch tip, not from the commit that triggered the
          # run. Uploads arrive in bursts, so by the time a run starts the tip
          # usually holds photos the triggering commit had never heard of.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pipeline
        run: pip install . pytest

      - name: Test the pipeline
        # A broken pipeline must not be allowed to rewrite the manifest.
        run: pytest -q

      - name: Process new photos
        run: grace-pipeline .

      - name: Commit the results
        run: |
          git config user.name "grace-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Everything written here is derived from photos/ and overrides.json,
          # so when main moves underneath the run the answer is to rebuild
          # against what is there now — never to merge. photos.json is rewritten
          # whole by every run, so rebasing one run's manifest onto another's
          # conflicts on principle and cannot be resolved: that is what stranded
          # seven photos on 2026-08-23.
          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain)" ]; then
              echo "Nothing changed."
              exit 0
            fi
            git add -A
            # This push uses GITHUB_TOKEN, which by design cannot trigger another
            # workflow run — so the pipeline cannot loop. A "[skip ci]" marker is
            # deliberately not used here: it would risk skipping the Pages build too.
            git commit -m "pipeline: update gallery"
            if git push; then
              exit 0
            fi
            echo "main moved while this run was working; rebuilding against it (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            grace-pipeline .
          done

          echo "Could not land the results after three attempts." >&2
          exit 1
